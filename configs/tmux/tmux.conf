# bind -T "ZETTEL" "Z" display-popup -w "95%" -h "95%" -d "#{pane_current_path}" -E "zk edit --working-dir='.' --interactive"

#- Prefixless Controls --------------------------------------------------------

# window navigation
bind -n "M-Tab" last-window   # cycle thru MRU windows
bind -n "M-1" select-window -t 1
bind -n "M-2" select-window -t 2
bind -n "M-3" select-window -t 3
bind -n "M-4" select-window -t 4
bind -n "M-5" select-window -t 5
bind -n "M-6" select-window -t 6
bind -n "M-7" select-window -t 7
bind -n "M-8" select-window -t 8
bind -n "M-9" select-window -t 9

# rolling/moving throu windows
bind -n "M-[" select-window -t -1
bind -n "M-]" select-window -t +1
bind -n "M-{" swap-window -t -1 \; select-window -t -1
bind -n "M-}" swap-window -t +1 \; select-window -t +1

#- [l] - Layout ---------------------------------------------------------------
bind "l" switch-client -T "LAYOUT" \; display-message "LAYOUT: [t]-Tiled [h]-MHor [v]-MVert [H]-EHor [V]-EVert"
bind -T "LAYOUT" "t" select-layout "tiled"
bind -T "LAYOUT" "h" select-layout "main-horizontal"
bind -T "LAYOUT" "v" select-layout "main-vertical"
bind -T "LAYOUT" "H" select-layout "even-horizontal"
bind -T "LAYOUT" "V" select-layout "even-vertical"

#------------------------------------------------------------------------------
# navigation

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_fzf="ps -o comm= -t '#{pane_tty}' | grep -q fzf"

bind -n "M-h" if-shell "$is_fzf" "send-keys M-h" "if-shell \"$is_vim\" \"send-keys M-h\" \"if -F '#{pane_at_left}' '' 'select-pane -L'"
bind -n "M-j" if-shell "$is_fzf" "send-keys M-j" "if-shell \"$is_vim\" \"send-keys M-j\" \"if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind -n "M-k" if-shell "$is_fzf" "send-keys M-k" "if-shell \"$is_vim\" \"send-keys M-k\" \"if -F '#{pane_at_top}' '' 'select-pane -U'"
bind -n "M-l" if-shell "$is_fzf" "send-keys M-l" "if-shell \"$is_vim\" \"send-keys M-l\" \"if -F '#{pane_at_right}' '' 'select-pane -R'"

# pane sizing
bind -n "M-H" if-shell "$is_vim" "send-keys M-H" "resize-pane -L 1"
bind -n "M-J" if-shell "$is_vim" "send-keys M-J" "resize-pane -D 1"
bind -n "M-K" if-shell "$is_vim" "send-keys M-K" "resize-pane -U 1"
bind -n "M-L" if-shell "$is_vim" "send-keys M-L" "resize-pane -R 1"

# Swap pane in a direction with Ctrl+Alt+h/j/k/l
bind -n C-M-h "swap-pane -t '{left-of}';  select-pane -t '!'"
bind -n C-M-j "swap-pane -t '{down-of}';  select-pane -t '!'"
bind -n C-M-k "swap-pane -t '{up-of}';    select-pane -t '!'"
bind -n C-M-l "swap-pane -t '{right-of}'; select-pane -t '!'"


set -g window-status-current-style "bg=yellow, fg=black"
set -g status-right "#{?client_prefix,[Prefix]#[default],} #[bg=yellow]%Y-%m-%d %H:%M"

bind g display-popup -d "#{pane_current_path}" -xC -yC -w95% -h95% -E "lazygit"

bind-key u run-shell '
    urls=$(tmux capture-pane -pS - | grep -oE "https?://[a-zA-Z0-9./?=_%#:-]+[a-zA-Z0-9/]" | sort -u)
    if [ -z "$urls" ]; then
        tmux display-message -d 3000 "No URLs found in pane"
    else
        tmux display-popup -E -w 80% -h 80% "
            printf \"%s\n\" \"$urls\" |
            fzf --exit-0 --bind \"alt-j:down,alt-k:up\" |
            xargs -r xdg-open
        "
    fi
'

bind-key t if-shell -F '#{==:#{session_name},popup}' 'detach-client' 'display-popup -d "#{pane_current_path}" -xC -yC -w 95% -h 95% -E "tmux attach-session -t popup || tmux new-session -s popup"'
